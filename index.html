<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#f4effc" />
    <meta
      name="description"
      content="Fluffy Merge — drop fuzzy pals, merge matching buddies, and collect the whole cuddle crew!"
    />
    <meta property="og:title" content="Fluffy Merge — a cozy game of fuzzy friends" />
    <meta
      property="og:description"
      content="Drop two matching fluffy pals together and discover a bigger buddy."
    />
    <meta property="og:type" content="website" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='18' fill='%23f3eaff'/><circle cx='32' cy='37' r='17' fill='%23bd9ee8'/><circle cx='20' cy='18' r='7' fill='%23bd9ee8'/><circle cx='44' cy='18' r='7' fill='%23bd9ee8'/><circle cx='27' cy='35' r='2.3' fill='%233d3048'/><circle cx='37' cy='35' r='2.3' fill='%233d3048'/><circle cx='23' cy='41' r='3' fill='%23ef9fbd'/><circle cx='41' cy='41' r='3' fill='%23ef9fbd'/></svg>"
    />
    <title>Fluffy Merge — a game of fuzzy friends</title>
  </head>
  <body>
    <div id="app">
      <div class="frame" id="frame">
        <canvas id="board" aria-label="Fluffy Merge play field — tap to drop a pal"></canvas>

        <div class="hud">
          <button class="icon-btn" id="btn-sound" type="button" aria-label="Mute sound"></button>
          <div class="hint">match two fluffy pals</div>
          <button class="icon-btn" id="btn-help" type="button" aria-label="How to play">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9.1" fill="none" stroke="currentColor" stroke-width="1.8" />
              <path
                d="M9.4 9.4a2.7 2.7 0 1 1 3.7 2.5c-.85.35-1.1.95-1.1 1.8"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
              <circle cx="12" cy="17" r="1.15" fill="currentColor" />
            </svg>
          </button>
          <button class="icon-btn" id="btn-restart" type="button" aria-label="New game">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M5.2 8.6A8.2 8.2 0 1 1 4.3 14.2"
                fill="none"
                stroke="currentColor"
                stroke-width="1.9"
                stroke-linecap="round"
              />
              <path
                d="M4.6 4.6v4.7h4.7"
                fill="none"
                stroke="currentColor"
                stroke-width="1.9"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>

        <div class="toast" id="toast" role="status" aria-live="polite"></div>

        <div class="overlay" id="overlay" aria-hidden="true">
          <div class="card" id="card" role="dialog" aria-modal="true" aria-label="Fluffy Merge"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
