<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#f6ecda" />
    <meta
      name="description"
      content="Paper Fold — a cosy paper-craft fruit merging game. Drop fruit into the jar, fold two of a kind, and don't overflow the limit line."
    />
    <meta property="og:title" content="Paper Fold — a fruit merging game" />
    <meta
      property="og:description"
      content="Drop fruit, fold two of a kind, and grow the biggest fruit in the jar."
    />
    <meta property="og:type" content="website" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='15' fill='%23fff8ec'/><circle cx='32' cy='38' r='17' fill='%23e2565c'/><circle cx='26' cy='32' r='5' fill='%23ff9b9f' opacity='.8'/><path d='M32 21c0-8 7-11 12-11' fill='none' stroke='%236f9349' stroke-width='3.4' stroke-linecap='round'/></svg>"
    />
    <title>Paper Fold — fruit merging game</title>
  </head>
  <body>
    <div id="app">
      <div class="frame" id="frame">
        <canvas id="board" aria-label="Paper Fold play field — tap to drop fruit"></canvas>

        <div class="hud">
          <button class="icon-btn" id="btn-sound" type="button" aria-label="Mute sound"></button>
          <div class="hint">fold two of a kind</div>
          <button class="icon-btn" id="btn-help" type="button" aria-label="How to play">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9.1" fill="none" stroke="currentColor" stroke-width="1.8" />
              <path
                d="M9.4 9.4a2.7 2.7 0 1 1 3.7 2.5c-.85.35-1.1.95-1.1 1.8"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
              <circle cx="12" cy="17" r="1.15" fill="currentColor" />
            </svg>
          </button>
          <button class="icon-btn" id="btn-restart" type="button" aria-label="New game">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M5.2 8.6A8.2 8.2 0 1 1 4.3 14.2"
                fill="none"
                stroke="currentColor"
                stroke-width="1.9"
                stroke-linecap="round"
              />
              <path
                d="M4.6 4.6v4.7h4.7"
                fill="none"
                stroke="currentColor"
                stroke-width="1.9"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>

        <div class="toast" id="toast" role="status" aria-live="polite"></div>

        <div class="overlay" id="overlay" aria-hidden="true">
          <div class="card" id="card" role="dialog" aria-modal="true" aria-label="Paper Fold"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
