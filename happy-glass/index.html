<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#f4f2ea" />
<title>Happy Glass — clone</title>
<style>
  :root {
    --ink: #20242c;
    --muted: #77808f;
    --line: #e2ded2;
    --bg: #f4f2ea;
    --card: #fffdf8;
    --water: #3aa0e6;
    --accent: #2f7ec4;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: var(--bg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 18px 6px;
  }
  header h1 {
    font-size: 15px; margin: 0; font-weight: 650; letter-spacing: -0.01em;
  }
  header h1 small { color: var(--muted); font-weight: 400; }
  header .spacer { flex: 1; }
  header .lv {
    font-size: 12px; color: var(--muted);
    display: flex; align-items: center; gap: 8px;
  }
  header .lv b { color: var(--ink); font-size: 13px; font-weight: 600; }

  main {
    flex: 1; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 4px 12px 10px;
    gap: 18px;
  }

  .stage {
    position: relative;
    display: flex;
  }
  canvas#game {
    display: block;
    border-radius: 18px;
    background: #fdfcf8;
    box-shadow: 0 10px 30px rgba(40,50,70,.10), 0 1px 0 rgba(255,255,255,.9) inset;
    touch-action: none;
    cursor: crosshair;
  }

  /* win card */
  #win {
    position: absolute; inset: 0;
    display: none; align-items: center; justify-content: center;
    background: rgba(244,242,234,.72);
    backdrop-filter: blur(3px);
    border-radius: 18px;
  }
  #win.show { display: flex; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px 22px 18px;
    text-align: center;
    box-shadow: 0 16px 40px rgba(40,50,70,.16);
    max-width: 280px;
  }
  .card h2 { margin: 0 0 6px; font-size: 17px; }
  .card p { margin: 0 0 14px; font-size: 12.5px; color: var(--muted); line-height: 1.5; }

  button {
    font: inherit; cursor: pointer; border-radius: 10px;
    border: 1px solid var(--line);
    background: #fffdf8; color: var(--ink);
    padding: 8px 14px; font-size: 13px;
    transition: .12s ease;
  }
  button:hover { border-color: #cfc8b8; transform: translateY(-1px); }
  button:active { transform: translateY(0); }
  button.primary {
    background: var(--accent); border-color: var(--accent); color: #fff;
  }

  /* hud */
  .hud {
    display: flex; flex-direction: column; gap: 10px;
    padding: 0 18px 12px;
    max-width: 720px; width: 100%; margin: 0 auto;
  }
  .meter {
    display: flex; align-items: center; gap: 10px;
    font-size: 11px; color: var(--muted);
  }
  .meter .label { width: 46px; text-transform: uppercase; letter-spacing: .07em; }
  .bar {
    flex: 1; height: 8px; border-radius: 99px;
    background: #e8e4d8; overflow: hidden;
  }
  .bar > i {
    display: block; height: 100%; width: 0%;
    border-radius: 99px; transition: width .12s linear;
  }
  #inkFill { background: var(--ink); }
  #progressFill { background: var(--water); }
  .meter .val { width: 62px; text-align: right; font-variant-numeric: tabular-nums; }

  #levels { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill {
    width: 28px; height: 28px; padding: 0; border-radius: 8px;
    font-size: 12px; color: var(--muted); border: 1px solid var(--line);
    background: #fffdf8; font-variant-numeric: tabular-nums;
  }
  .pill.on { background: var(--ink); border-color: var(--ink); color: #fff; }

  .tip { font-size: 11.5px; color: var(--muted); line-height: 1.5; }

  @media (max-width: 620px) {
    header { padding: 10px 14px 4px; }
    .hud { padding: 0 14px 10px; gap: 8px; }
    .meter .label { width: 40px; }
  }
</style>
</head>
<body>
  <header>
    <h1>Happy Glass <small>— a clone</small></h1>
    <div class="spacer"></div>
    <div class="lv"><span id="lvNum">Level 1</span><b id="lvName">First drop</b></div>
  </header>

  <main>
    <div class="stage">
      <canvas id="game" width="720" height="1080"></canvas>
      <div id="win">
        <div class="card">
          <h2>The glass is happy</h2>
          <p id="winText"></p>
          <button id="again">Replay</button>
          <button class="primary" id="next">Next level</button>
        </div>
      </div>
    </div>
  </main>

  <div class="hud">
    <div class="meter">
      <span class="label">Ink</span>
      <span class="bar"><i id="inkFill"></i></span>
      <span class="val" id="inkText">0 px</span>
    </div>
    <div class="meter">
      <span class="label">Fill</span>
      <span class="bar"><i id="progressFill"></i></span>
      <button id="reset">Reset</button>
    </div>
    <div id="levels"></div>
    <div class="tip">Drag to draw a line — it hardens the moment you let go. The water never runs out; your ink does.</div>
  </div>

  <script type="module" src="./game.js"></script>
</body>
</html>
