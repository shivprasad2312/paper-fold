name: rope_untangle
description: "Rope Untangle — a cozy wooden-ring rope puzzle (Flutter port)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/bg.jpg
    - assets/sounds/select.wav
    - assets/sounds/move.wav
    - assets/sounds/error.wav
    - assets/sounds/hint.wav
    - assets/sounds/win.wav
