<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Screw Puzzle (physics)</title>
  <style>
    :root { --ink: #4a2f16; --btn: #f6e2bd; --edge: #b98b52; --accent: #2f7d5b; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: #e9c48c;
      background-image: repeating-linear-gradient(0deg, rgba(120,70,20,.05) 0 2px, transparent 2px 9px);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column;
      user-select: none;
    }
    header {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 10px 14px;
    }
    .pill {
      background: var(--btn); border: 2px solid var(--edge); border-radius: 12px;
      padding: 6px 14px; font-weight: 700; box-shadow: 0 3px 0 var(--edge);
    }
    .btns { display: flex; gap: 8px; }
    button {
      background: var(--btn); border: 2px solid var(--edge); border-radius: 12px;
      padding: 6px 12px; font: inherit; font-weight: 700; color: var(--ink);
      box-shadow: 0 3px 0 var(--edge); cursor: pointer;
    }
    button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--edge); }
    #stageWrap { flex: 1; position: relative; min-height: 0; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    #msg {
      text-align: center; font-weight: 600; min-height: 1.5em; padding: 6px 12px 12px;
    }
    #win {
      position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
      background: rgba(60,35,10,.45);
    }
    #win.show { display: flex; }
    #win .card {
      background: var(--btn); border: 3px solid var(--edge); border-radius: 18px;
      padding: 24px 28px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.3);
    }
    #win h2 { margin: 0 0 8px; color: var(--accent); }
    #win button { background: var(--accent); color: #fff; border-color: #245c44; }
  </style>
</head>
<body>
  <header>
    <div class="pill" id="levelName">Level 1</div>
    <div class="pill" id="timer">0:00</div>
    <div class="btns">
      <button id="restart" title="Restart level">Restart</button>
      <button id="next" title="Skip to next level">Next ›</button>
    </div>
  </header>
  <div id="stageWrap"><canvas id="c"></canvas></div>
  <div id="msg">Tap a screw to unscrew it. Tap a loose screw, then an open hole, to park it.</div>

  <div id="win" role="dialog" aria-modal="true">
    <div class="card">
      <h2>Level cleared!</h2>
      <p id="winText"></p>
      <button id="winNext">Next level</button>
    </div>
  </div>

  <script src="vendor/matter.min.js"></script>
  <script src="game.js"></script>
  <script src="levels.js"></script>
  <script>
    (function () {
      const LEVELS = window.ScrewLevels.LEVELS;
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");
      const msg = document.getElementById("msg");
      const winEl = document.getElementById("win");
      const TICK = 1000 / 60;
      const KEY = "screw-puzzle-level-physics";

      let levelIndex = 0;
      try {
        const v = parseInt(localStorage.getItem(KEY), 10);
        if (v >= 0 && v < LEVELS.length) levelIndex = v;
      } catch (e) { /* ignore */ }

      let game = null;
      let view = { scale: 1, ox: 0, oy: 0 };
      let acc = 0;
      let last = performance.now();
      let startedAt = Date.now();
      let elapsed = 0;

      function startLevel(i) {
        levelIndex = i % LEVELS.length;
        try { localStorage.setItem(KEY, String(levelIndex)); } catch (e) { /* ignore */ }
        game = window.ScrewGame.createGame(Matter, LEVELS[levelIndex]);
        document.getElementById("levelName").textContent = LEVELS[levelIndex].name;
        winEl.classList.remove("show");
        msg.textContent = "Tap a screw to unscrew it. Tap a loose screw, then an open hole, to park it.";
        startedAt = Date.now();
        elapsed = 0;
        acc = 0;
      }

      function resize() {
        const r = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.round(r.width * dpr);
        canvas.height = Math.round(r.height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const W = game ? game.W : 420;
        const H = game ? game.H : 640;
        const s = Math.min(r.width / W, r.height / H);
        view = { scale: s, ox: (r.width - W * s) / 2, oy: (r.height - H * s) / 2 };
      }

      function toLogical(e) {
        const r = canvas.getBoundingClientRect();
        return { x: (e.clientX - r.left - view.ox) / view.scale, y: (e.clientY - r.top - view.oy) / view.scale };
      }

      function trySlotPos(i) {
        const H = game.H;
        const spacing = 56;
        const total = (game.tray - 1) * spacing;
        return { x: game.W / 2 - total / 2 + i * spacing, y: H - 40 };
      }

      function hit(p, x, y, r) {
        return Math.hypot(p.x - x, p.y - y) <= r;
      }

      function onPointer(e) {
        if (!game) return;
        const p = toLogical(e);
        const snap = game.snapshot();
        let res = null;

        // 1. a screw sitting in a hole (pinned or loose)
        for (const h of snap.holes) {
          if (h.screw && hit(h, p.x, p.y, 20)) { res = game.tapScrew(h.screw); break; }
        }
        // 2. a screw in a tray slot
        if (!res) {
          for (let i = 0; i < snap.tray.length; i++) {
            const sp = trySlotPos(i);
            if (snap.tray[i] && hit(sp, p.x, p.y, 20)) { res = game.tapScrew(snap.tray[i]); break; }
          }
        }
        // 3. an empty hole (drop the selected screw)
        if (!res) {
          for (const h of snap.holes) {
            if (!h.screw && hit(h, p.x, p.y, 20)) { res = game.tapHole(h.id); break; }
          }
        }
        if (res && !res.ok) {
          msg.textContent = res.reason;
        } else if (res && res.action === "unscrew") {
          msg.textContent = "Unscrewed. Let it fall, or park the screw somewhere.";
        } else if (res && res.action === "select") {
          msg.textContent = "Screw picked up. Tap an open hole to place it.";
        } else if (res && res.action === "place") {
          msg.textContent = res.pinned ? "Screwed back in." : "Parked in an open hole.";
        }
        if (game.status === "won") showWin();
      }

      function showWin() {
        document.getElementById("winText").textContent =
          "Cleared in " + timerText() + ". " + (levelIndex + 1 < LEVELS.length ? "Next level?" : "All levels done!");
        setTimeout(() => winEl.classList.add("show"), 600);
      }

      function timerText() {
        const sec = Math.floor((Date.now() - startedAt) / 1000);
        return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");
      }

      // ---------- drawing ----------
      function drawScrew(x, y, r, selected) {
        ctx.save();
        if (selected) {
          ctx.beginPath();
          ctx.arc(x, y, r + 6, 0, Math.PI * 2);
          ctx.strokeStyle = "#ffd23f";
          ctx.lineWidth = 3;
          ctx.stroke();
        }
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        const g = ctx.createRadialGradient(x - r * 0.4, y - r * 0.4, 1, x, y, r);
        g.addColorStop(0, "#fff3d6");
        g.addColorStop(0.6, "#d68c45");
        g.addColorStop(1, "#7a4a1e");
        ctx.fillStyle = g;
        ctx.fill();
        ctx.strokeStyle = "#3d2a14";
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.strokeStyle = "#3d2a14";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x - r * 0.45, y - r * 0.45);
        ctx.lineTo(x + r * 0.45, y + r * 0.45);
        ctx.moveTo(x + r * 0.45, y - r * 0.45);
        ctx.lineTo(x - r * 0.45, y + r * 0.45);
        ctx.stroke();
        ctx.restore();
      }

      function drawHole(x, y, r) {
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(70,40,15,.55)";
        ctx.fill();
        ctx.strokeStyle = "rgba(255,255,255,.35)";
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      function drawPiece(p) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        const x = -p.w / 2, y = -p.h / 2;
        const r = 6;
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + p.w, y, x + p.w, y + p.h, r);
        ctx.arcTo(x + p.w, y + p.h, x, y + p.h, r);
        ctx.arcTo(x, y + p.h, x, y, r);
        ctx.arcTo(x, y, x + p.w, y, r);
        ctx.closePath();
        if (p.kind === "metal") {
          const g = ctx.createLinearGradient(0, y, 0, y + p.h);
          g.addColorStop(0, "#9fdcf5");
          g.addColorStop(0.5, "#4fa8dc");
          g.addColorStop(1, "#2d7fb3");
          ctx.fillStyle = g;
        } else {
          const g = ctx.createLinearGradient(0, y, 0, y + p.h);
          g.addColorStop(0, "#c98a4f");
          g.addColorStop(0.5, "#a86a35");
          g.addColorStop(1, "#7d4a22");
          ctx.fillStyle = g;
        }
        ctx.fill();
        ctx.strokeStyle = "rgba(40,20,5,.55)";
        ctx.lineWidth = 1.5;
        ctx.stroke();
        // grain / sheen lines
        ctx.strokeStyle = "rgba(255,255,255,.15)";
        ctx.lineWidth = 1;
        for (let i = 1; i < 3; i++) {
          ctx.beginPath();
          ctx.moveTo(x + 6, y + (p.h * i) / 3);
          ctx.lineTo(x + p.w - 6, y + (p.h * i) / 3);
          ctx.stroke();
        }
        ctx.restore();
      }

      function draw() {
        const r = canvas.getBoundingClientRect();
        ctx.clearRect(0, 0, r.width, r.height);
        if (!game) return;
        const snap = game.snapshot();
        ctx.save();
        ctx.translate(view.ox, view.oy);
        ctx.scale(view.scale, view.scale);

        // board backdrop
        ctx.fillStyle = "rgba(255,255,255,.12)";
        ctx.fillRect(0, 0, game.W, game.H - 70);

        for (const h of snap.holes) drawHole(h.x, h.y, 13);
        for (const p of snap.pieces) if (!p.fallen) drawPiece(p);

        // loose screws in holes
        for (const h of snap.holes) {
          if (!h.screw) continue;
          const s = snap.screws.find((x) => x.id === h.screw);
          drawScrew(h.x, h.y, 11, snap.selected === h.screw && !s.pinned);
        }
        // pinned screws (drawn last so they sit on top of the planks)
        for (const h of snap.holes) {
          if (!h.screw) continue;
          const s = snap.screws.find((x) => x.id === h.screw);
          if (s.pinned) drawScrew(h.x, h.y, 11, false);
        }

        // tray
        for (let i = 0; i < snap.tray.length; i++) {
          const sp = trySlotPos(i);
          drawHole(sp.x, sp.y, 16);
          if (snap.tray[i]) drawScrew(sp.x, sp.y, 12, snap.selected === snap.tray[i]);
        }
        ctx.restore();
      }

      function frame(now) {
        const dt = Math.min(now - last, 100);
        last = now;
        if (game && game.status === "playing") {
          acc += dt;
          let n = 0;
          while (acc >= TICK && n < 6) { game.step(TICK); acc -= TICK; n++; }
          if (acc >= TICK) acc = 0;
          if (game.status === "won") showWin();
        }
        draw();
        const sec = Math.floor((Date.now() - startedAt) / 1000);
        document.getElementById("timer").textContent =
          Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");
        requestAnimationFrame(frame);
      }

      canvas.addEventListener("pointerdown", onPointer);
      window.addEventListener("resize", resize);
      document.getElementById("restart").addEventListener("click", () => { startLevel(levelIndex); resize(); });
      document.getElementById("next").addEventListener("click", () => { startLevel(levelIndex + 1); resize(); });
      document.getElementById("winNext").addEventListener("click", () => { startLevel(levelIndex + 1); resize(); });

      startLevel(levelIndex);
      resize();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
