<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nuts & Bolts — Sort Puzzle</title>
  <style>
    :root {
      --bg: #1e2430;
      --panel: #2a3242;
      --bolt: #8a94a6;
      --text: #f2f5fa;
      --accent: #ffc247;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #2e3950, var(--bg));
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      user-select: none;
    }
    header {
      width: min(680px, 100%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    h1 { font-size: 1.4rem; margin: 0; }
    .stats { display: flex; gap: 16px; font-variant-numeric: tabular-nums; opacity: .9; }
    .stats b { color: var(--accent); }
    .controls { display: flex; gap: 8px; }
    button {
      background: var(--panel);
      color: var(--text);
      border: 1px solid #3c4760;
      border-radius: 10px;
      padding: 8px 14px;
      font: inherit;
      cursor: pointer;
    }
    button:hover:not(:disabled) { border-color: var(--accent); }
    button:disabled { opacity: .4; cursor: default; }

    #board {
      margin-top: 28px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 22px 18px;
      width: min(680px, 100%);
    }
    .bolt {
      position: relative;
      width: 64px;
      height: 280px;
      cursor: pointer;
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      padding-bottom: 10px;
    }
    /* the metal post */
    .bolt::before {
      content: "";
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: calc(100% - 8px);
      border-radius: 7px 7px 10px 10px;
      background: linear-gradient(90deg, #5d6678, #c9d1df 50%, #5d6678);
      box-shadow: 0 6px 12px rgba(0,0,0,.35);
    }
    /* the base plate */
    .bolt::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 6px;
      right: 6px;
      height: 12px;
      border-radius: 6px;
      background: var(--bolt);
    }
    .bolt.selected { transform: translateY(-18px); }
    .bolt.selected::before { box-shadow: 0 0 0 3px var(--accent), 0 6px 12px rgba(0,0,0,.35); }
    .bolt.done .nut { filter: brightness(1.1); }
    .bolt.done::after { background: #4fd18b; }
    .bolt.invalid { animation: shake .3s; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .nut {
      position: relative;
      z-index: 1;
      width: 52px;
      height: 46px;
      margin-bottom: 3px;
      background: var(--c);
      clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%);
      box-shadow: inset 0 -4px 0 rgba(0,0,0,.25), inset 0 3px 0 rgba(255,255,255,.25);
      transition: transform .15s;
      animation: drop .25s ease-out;
    }
    .nut::after {
      /* the hole in the middle of the nut */
      content: "";
      position: absolute;
      left: 50%; top: 50%;
      width: 18px; height: 18px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: var(--bg);
      box-shadow: inset 0 2px 4px rgba(0,0,0,.5);
    }
    @keyframes drop {
      from { transform: translateY(-30px); opacity: 0; }
      to { transform: none; opacity: 1; }
    }

    #message {
      margin-top: 22px;
      min-height: 1.6em;
      font-weight: 600;
      color: var(--accent);
    }
    #win {
      position: fixed; inset: 0;
      display: none;
      align-items: center; justify-content: center;
      background: rgba(10,14,22,.7);
    }
    #win.show { display: flex; }
    #win .card {
      background: var(--panel);
      padding: 28px 32px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,.5);
    }
    #win h2 { margin: 0 0 8px; color: var(--accent); }
    #win p { margin: 0 0 18px; opacity: .85; }
    #win button { background: var(--accent); color: #222; border: none; font-weight: 700; }
    footer { margin-top: auto; padding-top: 24px; opacity: .6; font-size: .85rem; }
  </style>
</head>
<body>
  <header>
    <h1>Nuts &amp; Bolts</h1>
    <div class="stats">
      <span>Level <b id="level">1</b></span>
      <span>Moves <b id="moves">0</b></span>
    </div>
    <div class="controls">
      <button id="undo" title="Undo last move">Undo</button>
      <button id="restart" title="Restart this level">Restart</button>
      <button id="next" title="Skip to next level">Next ›</button>
    </div>
  </header>

  <main id="board" aria-label="Puzzle board"></main>
  <div id="message">Tap a bolt to lift its top nut, then tap another bolt to drop it.</div>

  <div id="win" role="dialog" aria-modal="true" aria-labelledby="win-title">
    <div class="card">
      <h2 id="win-title">Level complete!</h2>
      <p id="win-text"></p>
      <button id="win-next">Next level</button>
    </div>
  </div>

  <footer>Original sort-puzzle implementation. Progress is saved in this browser.</footer>

  <script src="logic.js"></script>
  <script>
    (function () {
      const L = window.NutsLogic;
      const PALETTE = ["#ff6b6b", "#4dabf7", "#51cf66", "#ffd43b", "#b197fc", "#ff922b", "#38d9a9", "#f783ac"];
      const STORAGE_KEY = "nuts-and-bolts-progress";

      const els = {
        board: document.getElementById("board"),
        level: document.getElementById("level"),
        moves: document.getElementById("moves"),
        undo: document.getElementById("undo"),
        restart: document.getElementById("restart"),
        next: document.getElementById("next"),
        message: document.getElementById("message"),
        win: document.getElementById("win"),
        winText: document.getElementById("win-text"),
        winNext: document.getElementById("win-next"),
      };

      let level = 1;
      let state = [];
      let initial = [];
      let history = [];
      let moves = 0;
      let selected = null;
      let busy = false;

      function loadProgress() {
        try {
          const v = parseInt(localStorage.getItem(STORAGE_KEY), 10);
          return Number.isFinite(v) && v > 0 ? v : 1;
        } catch (e) {
          return 1;
        }
      }
      function saveProgress() {
        try { localStorage.setItem(STORAGE_KEY, String(level)); } catch (e) { /* ignore */ }
      }

      function startLevel(n) {
        level = n;
        const lv = L.generateLevel(level);
        initial = L.cloneState(lv.state);
        state = L.cloneState(lv.state);
        history = [];
        moves = 0;
        selected = null;
        busy = false;
        saveProgress();
        els.win.classList.remove("show");
        els.message.textContent = "Tap a bolt to lift its top nut, then tap another bolt to drop it.";
        render();
      }

      function render() {
        els.level.textContent = level;
        els.moves.textContent = moves;
        els.undo.disabled = history.length === 0 || busy;
        els.board.innerHTML = "";
        state.forEach((bolt, i) => {
          const el = document.createElement("div");
          el.className = "bolt";
          el.dataset.index = i;
          el.setAttribute("role", "button");
          el.setAttribute("aria-label", "Bolt " + (i + 1));
          if (selected === i) el.classList.add("selected");
          if (L.isComplete(bolt) && bolt.length) el.classList.add("done");
          bolt.forEach((c) => {
            const nut = document.createElement("div");
            nut.className = "nut";
            nut.style.setProperty("--c", PALETTE[c]);
            el.appendChild(nut);
          });
          el.addEventListener("click", () => onBoltClick(i, el));
          els.board.appendChild(el);
        });
      }

      function flashInvalid(index) {
        const el = els.board.querySelector('.bolt[data-index="' + index + '"]');
        if (!el) return;
        el.classList.remove("invalid");
        void el.offsetWidth;
        el.classList.add("invalid");
      }

      function onBoltClick(i) {
        if (busy) return;
        if (selected === null) {
          if (state[i].length === 0) return;
          if (L.isComplete(state[i]) && state[i].length) {
            els.message.textContent = "That bolt is already complete.";
            return;
          }
          selected = i;
          render();
          return;
        }
        if (selected === i) {
          selected = null;
          render();
          return;
        }
        const next = L.applyMove(state, selected, i);
        if (!next) {
          flashInvalid(i);
          els.message.textContent = "Can't drop it there: the bolt is full or the top nut is a different colour.";
          selected = null;
          render();
          return;
        }
        history.push(state);
        state = next;
        moves++;
        selected = null;
        els.message.textContent = "";
        render();
        if (L.isSolved(state)) onWin();
      }

      function onWin() {
        busy = true;
        els.winText.textContent = "Solved in " + moves + " moves. On to level " + (level + 1) + "!";
        setTimeout(() => {
          els.win.classList.add("show");
          els.winNext.focus();
        }, 450);
      }

      els.undo.addEventListener("click", () => {
        if (!history.length || busy) return;
        state = history.pop();
        moves = Math.max(0, moves - 1);
        selected = null;
        render();
      });
      els.restart.addEventListener("click", () => {
        if (busy) return;
        state = L.cloneState(initial);
        history = [];
        moves = 0;
        selected = null;
        render();
      });
      els.next.addEventListener("click", () => startLevel(level + 1));
      els.winNext.addEventListener("click", () => startLevel(level + 1));

      document.addEventListener("keydown", (e) => {
        if (e.key === "z" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); els.undo.click(); }
        if (e.key === "Escape") { selected = null; render(); }
      });

      startLevel(loadProgress());
    })();
  </script>
</body>
</html>
