# KUBIK test gate — runs on every push and pull request, so a change (or a
# new level) can never land with a level that has no completable route.
#
# At 200 levels the live suite is stratified (ADR-015): the push gate plays
# the CHANGED levels plus a rotating 50-level quarter (~10 min); the FULL
# 200 runs in the nightly workflow (nightly-full-play.yml).
name: Test gate

on:
  push:
  pull_request:

jobs:
  levels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start preview server
        run: |
          (npx vite preview --host 127.0.0.1 --port 4173 > /tmp/preview.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ > /dev/null && break
            sleep 1
          done

      - name: Unit tests (rules, save/medals, daily, catalogue)
        run: npm run test:unit

      - name: Verify (pure-Node solvability proof)
        run: npm run verify

      - name: Live-play gate (changed levels + rotating 50)
        run: URL=http://127.0.0.1:4173/ KUBIK_CHANGED_REF=HEAD~1..HEAD npm run test:play

      - name: Regression tests (pinned bugs)
        run: URL=http://127.0.0.1:4173/ npm run regression

      - name: Full browser playtest (mechanics + themes + camera)
        run: URL=http://127.0.0.1:4173/ npm run playtest
